# Local development overrides.
# cp docker/docker-compose.override.example.yml docker-compose.override.yml

services:
  fusesearch:
    build:
      args:
        INSTALL_EXTRAS: all,dev
    volumes:
      - ./fusesearch:/app/fusesearch
      - ./tests:/app/tests

  fusesearch-mcp:
    build:
      args:
        INSTALL_EXTRAS: all,dev
    volumes:
      - ./fusesearch:/app/fusesearch
      - ./tests:/app/tests
