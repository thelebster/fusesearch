[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusesearch"
version = "0.2.1"
description = "Multi-source search aggregation tool with AI-powered retrieval and response synthesis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Anton Lebedev", email = "pypi@katzo.net" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.12",
    "qdrant-client>=1.16",
    "fastapi>=0.129",
    "uvicorn>=0.40",
    "tqdm>=4.67",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.26",
]
local = [
    "sentence-transformers>=5.2",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.40",
]
ollama = [
    "ollama>=0.4",
]
all = [
    "fusesearch[mcp,local,openai,anthropic,ollama]",
]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
include = ["fusesearch*"]

[project.urls]
Homepage = "https://github.com/thelebster/fusesearch"
Repository = "https://github.com/thelebster/fusesearch"
Issues = "https://github.com/thelebster/fusesearch/issues"
