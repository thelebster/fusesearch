x-fusesearch: &fusesearch
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./data:/app/data
    - ./data/models:/root/.cache/huggingface
  environment:
    QDRANT_HOST: qdrant
    QDRANT_PORT: 6333
    # Suppress noisy model loading warnings from sentence-transformers.
    # https://huggingface.co/docs/transformers/en/main_classes/logging
    TRANSFORMERS_VERBOSITY: error
  env_file:
    - path: .env
      required: false
  depends_on:
    qdrant:
      condition: service_healthy

services:
  fusesearch:
    <<: *fusesearch
    ports:
      - "${FUSESEARCH_PORT:-8000}:8000"

  fusesearch-mcp:
    <<: *fusesearch
    command: python -m fusesearch mcp --transport sse
    ports:
      - "${MCP_PORT:-8001}:8001"

  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant.Dockerfile
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
